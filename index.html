<!DOCTYPE html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ESCALA 5x1 - VERSÃO QUE NÃO APAGA</title>
<style>
body{font-family:Arial;background:#f0f2f5;padding:8px;margin:0}
.box{background:#fff;border-radius:12px;padding:12px;max-width:1100px;margin:auto}
label{font-size:11px;font-weight:bold;color:#1f4e79;display:block;margin-top:6px}
select,input{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:15px;margin-top:3px}
button{width:100%;padding:13px;border:none;border-radius:8px;color:#fff;font-weight:bold;margin:5px 0;font-size:13px;background:#27a060}
.b{background:#f4a61b;color:#ab6c00}.a{background:#1fc40f;color:#000}.r{background:#e67e22}.y{background:#6e9fff}
.card{color:#fff;padding:8px;border-radius:10px}.card b{color:#ab6c00}
#msg{color:ok;display:none}
table{width:100%;border-collapse:collapse;font-size:11px;margin-top:10px}
th,td{border:1px solid #ccc;padding:5px;text-align:center}
th{background:#1f4e79;color:#fff}.FM{background:#6ef8fc;font-weight:bold}
.FO{background:#f1c40f;color:#000}.FI{background:#0392b2;color:#fff}
.FE{background:#fff3cd;padding:10px;border-radius:8px;color:#856404;font-size:11px;margin:6px 0}
</style></head><body>
<div class="box">
<h2 style="text-align:center">ESCALA 5x1 - VERSÃO QUE NÃO APAGA</h2>
<div id="msg" class="FE"></div>
<div class="warn" style="background:#e8f8e5;border:1px solid #b3d8b7;padding:10px;border-radius:10px"><b>COMO USAR SEM APAGAR:</b><br>1. Adicione o pessoal e escolha o dia da folga<br>2. Clique em DEFINIR ESCALA QUE INSERI - NÃO APAGAR MAIS</div>

<div class="card" style="background:#e8f8f5;border:1px solid #ab6c00">
<b style="color:#ab6c00">📌 TRAVAR SUA ESCALA PERSONALIZADA</b><br>
<button class="b" onclick="definirMinhaEscala()">💾 DEFINIR ESCALA QUE EU INSERI - NÃO APAGAR MAIS</button>
</div>

<div class="row" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
<div><label>Data referência</label><input type="date" id="dataInicio" value="2026-10-04"></div>
<div><label>Mês travar</label><input type="month" id="mesTravar" value="2026-10"></div>
</div>

<div class="card" style="background:#fff;border:1px solid #ddd;margin-top:8px">
<label>NOME</label><input id="nome" placeholder="Ex: Jose Marcos">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label>HORÁRIO</label><input type="time" id="hin" value="10:00"></div><div><label></label><input type="time" id="hout" value="18:20"></div></div>
<label>TIPO</label><select id="tipo" onchange="trocaTipo()"><option value="5x1">5x1 AUTOMÁTICO</option><option value="fixa">FOLGA FIXA (ex: toda segunda)</option></select>
<div id="areaFixa" style="display:none"><label>DIA FOLGA FIXA</label><select id="diaSemana"><option value="Segunda">Segunda</option><option value="Terça">Terça</option><option value="Quarta">Quarta</option><option value="Quinta">Quinta</option><option value="Sexta">Sexta</option><option value="Sábado">Sábado</option><option value="Domingo">Domingo</option></select></div>
<div id="area5x1"><label>ESCOLHA O DIA QUE ELE FOLGA</label><select id="inicioFolga"><option value="0">Folga dias 06, 12, 18, 24, 30</option><option value="1">Folga dias 07, 13, 19, 25, 31</option><option value="2">Folga dias 01, 07, 13, 19, 25</option><option value="3">Folga dias 02, 08, 14, 20, 26</option><option value="4">Folga dias 03, 09, 15, 21, 27</option><option value="5">Folga dias 04, 10, 16, 22, 28</option></select></div>
<div id="areaErs" style="display:none"><label>DIAS QUE FOLGA</label><input id="diasFolga" placeholder="Ex: 5, 12, 19, 26"></div>
<button class="a" onclick="add()">+ ADICIONAR</button>
</div>

<div class="row" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
<div><label>MÊS</label><select id="mes" onchange="gerar()"><option value="9">SETEMBRO</option><option value="10" selected>OUTUBRO</option><option value="11">NOVEMBRO</option><option value="12">DEZEMBRO</option></select></div>
<div><label></label><button class="b" onclick="gerar()">GERAR ESCALA AGORA</button></div>
</div>

<div class="row" style="display:flex;gap:6px"><button class="p" onclick="salvarDefinitivo()" style="flex:1;background:#ffcc00;color:#000">💾 SALVAR DEFINITIVA</button><button class="y" onclick="carregarSalvo()" style="flex:1">📂 CARREGAR SALVO</button></div>
<div id="lista" style="background:#eee;padding:8px;border-radius:8px;margin:6px 0;font-size:12px"></div>
<div style="overflow:auto"><table id="tab"><tbody><tr><td>Adicione funcionários</td></tr></tbody></table></div>
<div class="row" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="y" onclick="exemploSeguro()">CARREGAR EXEMPLO (com confirmação)</button><button class="a" onclick="window.print()">🖨️ IMPRIMIR / PDF</button></div>
<button class="r" onclick="limparTudo()">🗑️ LIMPAR TUDO</button>
</div>

<script>
let chaveFuncs = 'plugtv_ESCALA_FUNCS_FINAL_UNICO';
let chaveTravada = 'plugtv_ESCALA_TRAVADA_FINAL_UNICO';
let chaveMes = 'plugtv_ESCALA_MES_FINAL';
var funcs = [];
var escalaTravada = null;

function showMsg(t){
  var m=document.getElementById('msg'); m.style.display='block'; m.innerText=t; setTimeout(()=>{m.style.display='none'},4000);
}
function trocaTipo(){
  var t=document.getElementById('tipo').value;
  document.getElementById('areaFixa').style.display = (t=='fixa'?'block':'none');
  document.getElementById('area5x1').style.display = (t=='5x1'?'block':'none');
}
function definirMinhaEscala(){
  if(funcs.length==0){ alert('Adicione funcionários primeiro!'); return; }
  localStorage.setItem(chaveFuncs, JSON.stringify(funcs));
  escalaTravada = JSON.parse(JSON.stringify(funcs));
  localStorage.setItem(chaveTravada, JSON.stringify(escalaTravada));
  showMsg('✅ ATENÇÃO: Você tem '+funcs.length+' funcionários cadastrados com sua escala. Salvo definitivo! Agora não apaga mais mesmo atualizando.');
}
function salvarDefinitivo(){
  localStorage.setItem(chaveFuncs, JSON.stringify(funcs));
  if(escalaTravada) localStorage.setItem(chaveTravada, JSON.stringify(escalaTravada));
  showMsg('✅ Salvo definitivo!');
}
function carregarSalvo(){
  var s=localStorage.getItem(chaveFuncs);
  var t=localStorage.getItem(chaveTravada);
  if(s){ funcs=JSON.parse(s); renderLista(); gerar(); showMsg('📂 '+funcs.length+' funcionários carregados'); }
  else showMsg('❌ Nenhum salvo encontrado');
  if(t) escalaTravada=JSON.parse(t);
}
function exemploSeguro(){
  if(funcs.length>0){ if(!confirm('ATENÇÃO! Você já tem '+funcs.length+' funcionários cadastrados com sua escala. Quer substituir pelo exemplo?')) return; }
  funcs=[{nome:'Ana',hin:'10:00',hout:'18:20',tipo:'5x1',inicioFolga:0},{nome:'Carlos',hin:'10:00',hout:'18:20',tipo:'fixa',diaSemana:'Segunda'}];
  renderLista(); salvarDefinitivo(); gerar();
}
function add(){
  var nome=document.getElementById('nome').value.trim();
  if(!nome){ alert('Digite nome'); return; }
  var hin=document.getElementById('hin').value;
  var hout=document.getElementById('hout').value;
  var tipo=document.getElementById('tipo').value;
  var diaSemana=document.getElementById('diaSemana').value;
  var inicioFolga=parseInt(document.getElementById('inicioFolga').value)||0;
  funcs.push({nome,hin,hout,tipo,diaSemana,inicioFolga});
  document.getElementById('nome').value='';
  renderLista(); gerar(); localStorage.setItem(chaveFuncs, JSON.stringify(funcs));
}
function renderLista(){
  var el=document.getElementById('lista');
  if(funcs.length==0){ el.innerHTML='Nenhum funcionário'; return; }
  var h='Adicionados: ';
  funcs.forEach((f,i)=>{ h+=`${f.nome} <a onclick="rem(${i})" style="color:red;cursor:pointer">[X]</a> `; });
  el.innerHTML=h;
}
function rem(i){ funcs.splice(i,1); renderLista(); gerar(); localStorage.setItem(chaveFuncs, JSON.stringify(funcs)); }
function gerar(){
  var mes=parseInt(document.getElementById('mes').value); var ano=parseInt(document.getElementById('mesTravar').value.split('-')[0])||2026;
  localStorage.setItem(chaveMes, JSON.stringify({mes,ano}));
  var tab=document.getElementById('tab'); if(funcs.length==0) return;
  var diasNoMes=new Date(ano,mes,0).getDate();
  var html='<tr><th>Nome</th>';
  for(let d=1;d<=diasNoMes;d++) html+=`<th>${d}</th>`;
  html+='</tr>';
  funcs.forEach(f=>{
    html+=`<tr><td><b>${f.nome}</b><br><small>${f.hin}-${f.hout}</small></td>`;
    for(let d=1;d<=diasNoMes;d++){
      let dia=new Date(ano,mes-1,d).toLocaleDateString('pt-BR',{weekday:'short'});
      let folga=false;
      if(f.tipo=='fixa'){ if(dia.toLowerCase().includes(f.diaSemana.toLowerCase().slice(0,3))) folga=true; }
      else { let ciclo=(d+f.inicioFolga)%6; if(ciclo==0) folga=true; }
      html+=`<td class="${folga?'FO':'FM'}">${folga?'FOLGA':''}</td>`;
    }
    html+='</tr>';
  });
  tab.innerHTML=html;
}
function limparTudo(){
  if(!confirm('Apagar tudo mesmo?')) return;
  funcs=[]; escalaTravada=null;
  localStorage.removeItem(chaveFuncs); localStorage.removeItem(chaveTravada);
  renderLista(); document.getElementById('tab').innerHTML='<tr><td>Limpo</td></tr>';
}
window.onload=function(){
  try{
    var s=localStorage.getItem(chaveFuncs) || localStorage.getItem('funcsEscala');
    var t=localStorage.getItem(chaveTravada) || localStorage.getItem('escalaTravada');
    if(s){ funcs=JSON.parse(s); if(!localStorage.getItem(chaveFuncs)) localStorage.setItem(chaveFuncs, s); }
    if(t) escalaTravada=JSON.parse(t);
    renderLista(); if(funcs.length) gerar();
    var oldMes=localStorage.getItem('mesEscala'); if(oldMes) document.getElementById('mes').value=JSON.parse(oldMes).mes||10;
  }catch(e){}
}
</script></body></html>
